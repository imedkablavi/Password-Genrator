name: Markdown cleanup

on:
  push:
    paths:
      - '.github/workflows/markdown-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean Markdown prose
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          names = subprocess.check_output(
              ["git", "ls-files", "-z", "*.md"]
          ).decode("utf-8").split("\0")

          emoji = re.compile(
              "["
              "\U0001F1E6-\U0001F1FF"
              "\U0001F300-\U0001F5FF"
              "\U0001F600-\U0001F64F"
              "\U0001F680-\U0001F6FF"
              "\U0001F700-\U0001F77F"
              "\U0001F780-\U0001F7FF"
              "\U0001F800-\U0001F8FF"
              "\U0001F900-\U0001F9FF"
              "\U0001FA00-\U0001FAFF"
              "\u2600-\u26FF"
              "\u2700-\u27BF"
              "]"
          )

          fence = re.compile(r"^\s*(```|~~~)")
          heading_spaces = re.compile(r"^(#{1,6})[ \t]{2,}")
          list_spaces = re.compile(r"^(\s*(?:[-*+]|\d+\.))[ \t]{2,}")

          for name in filter(None, names):
              path = pathlib.Path(name)
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              in_fence = False
              out = []
              for line in original.splitlines(keepends=True):
                  if fence.match(line):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if in_fence:
                      out.append(line)
                      continue

                  ending = "\n" if line.endswith("\n") else ""
                  body = line[:-1] if ending else line
                  body = body.replace("—", "-")
                  body = emoji.sub("", body)
                  body = body.replace("\ufe0f", "").replace("\u200d", "").replace("\u20e3", "")
                  body = heading_spaces.sub(r"\1 ", body)
                  body = list_spaces.sub(r"\1 ", body)
                  body = re.sub(r"[ \t]+$", "", body)
                  out.append(body + ending)

              cleaned = "".join(out)
              if cleaned != original:
                  path.write_text(cleaned, encoding="utf-8")
          PY

          rm -f .github/workflows/markdown-cleanup.yml

          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove emojis and em dashes from Markdown'
          git push
